# One root template so generated projects record `_commit` and can take
# template changes with `copier update`. Each shape still renders from its own
# independent `<shape>/template/` dir — the shape answer only picks which one.
_subdirectory: "{{ project_shape }}/template"

# .gitkeep files exist only so this repo's own git tracks otherwise-empty
# dirs — not something a generated project should see. None of these paths
# ships in any shape, so one list covers all of them. data-analysis's data/
# and reports/figures/ .gitkeep files are deliberately absent: those dirs stay
# empty/gitignored in the *generated* project too (see its .gitignore), so
# their .gitkeep ships for real — it's the only thing that lets them survive
# a clone.
_exclude:
  - "tests/.gitkeep"
  - "tests/unit/.gitkeep"
  - "tests/integration/.gitkeep"
  - "tests/example_unit/.gitkeep"
  - "static/.gitkeep"

project_shape:
  type: str
  help: "What kind of project? (details: Shapes table in the template README)"
  # Labels kept short enough not to wrap in an 80-column terminal.
  choices:
    "library — importable package (PyPI or used by other projects)": library
    "app — CLI or GUI application": app
    "web-app — running server: FastAPI, Flask or Dash": web-app
    "data-analysis — notebooks, data/, reports/, plus a src/ package": data-analysis
    "multi-subpackage — independent units in one package/lockfile": multi-subpackage
    "scripts — standalone scripts sharing a shared/ module": scripts

project_name:
  type: str
  help: Human-readable project name

project_slug:
  type: str
  help: >-
    {% if project_shape == 'scripts' -%}
    Project slug (snake_case) — used as pyproject.toml's [project] name; this shape has no importable package
    {%- else -%}
    Import / package name (snake_case)
    {%- endif %}
  default: "{{ project_name.lower().replace('-', '_').replace(' ', '_') }}"
  validator: >-
    {% if not (project_slug.isidentifier() and project_slug == project_slug.lower()) %}
    project_slug must be a valid, all-lowercase Python identifier (letters,
    digits, underscores; can't start with a digit).
    {% endif %}

project_description:
  type: str
  help: One-line description
  default: ""

project_keywords:
  type: str
  help: "Comma-separated keywords for pyproject.toml's [project] keywords (optional)"
  default: ""

python_version:
  type: str
  help: "Python version, major.minor only (e.g. 3.14) — check with `uv python list --managed-python --no-python-downloads`"
  default: "3.14"
  validator: >-
    {% if not (python_version.count('.') == 1 and python_version.replace('.', '').isdigit()) %}
    python_version must be MAJOR.MINOR using digits only (e.g. 3.14).
    {% endif %}

author_name:
  type: str

gitleaks_version:
  type: str
  help: "gitleaks version — pins both the prek hook rev and the README install snippet"
  default: "8.30.1"
  validator: >-
    {% set segments = gitleaks_version.split('.') %}
    {% set ns = namespace(ok=true) %}
    {% for segment in segments %}{% if not segment.isdigit() %}{% set ns.ok = false %}{% endif %}{% endfor %}
    {% if not ns.ok %}
    gitleaks_version must be digits separated by dots (e.g. 8.30.1).
    {% endif %}

license_year:
  type: str
  help: "Copyright year for LICENSE"
  default: "2026"

notebook_runtime:
  type: str
  help: "Notebook runtime: ipykernel (VS Code Jupyter extension), jupyterlab (browser), both, or none"
  choices:
    - ipykernel
    - jupyterlab
    - both
    - none
  default: ipykernel
  when: "{{ project_shape == 'data-analysis' }}"
