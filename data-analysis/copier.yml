_subdirectory: template

# tests/.gitkeep exists only so this repo's own git tracks the otherwise-empty
# tests/ dir — not something a generated project should see (real test files
# show up there almost immediately). The data/ and reports/figures/ .gitkeep
# files are different: those dirs are meant to stay empty/gitignored in the
# *generated* project too (see .gitignore), so their .gitkeep ships for real
# — it's the only thing that lets those empty dirs survive a clone.
_exclude:
  - "tests/.gitkeep"

project_name:
  type: str
  help: Human-readable project name

project_slug:
  type: str
  help: Import / package name (snake_case)
  default: "{{ project_name.lower().replace('-', '_').replace(' ', '_') }}"

project_description:
  type: str
  help: One-line description
  default: ""

python_version:
  type: str
  help: "Python version, major.minor only (e.g. 3.14) — check with `uv python list --managed-python --no-python-downloads`"
  default: "3.14"

author_name:
  type: str

author_email:
  type: str

gitleaks_version:
  type: str
  help: "gitleaks version — pins both the prek hook rev and the README install snippet"
  default: "8.30.1"

license_year:
  type: str
  help: "Copyright year for LICENSE"
  default: "2026"

notebook_runtime:
  type: str
  help: "Notebook runtime: ipykernel (VS Code Jupyter extension), jupyterlab (browser), both, or none"
  choices:
    - ipykernel
    - jupyterlab
    - both
    - none
  default: ipykernel
